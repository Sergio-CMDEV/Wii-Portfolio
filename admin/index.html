<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de proyectos &middot; Wii Portfolio</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
    <div class="topbar">
        <h1><span class="dot"></span>Panel de proyectos</h1>

        <label class="user-field">
            Cuenta de GitHub
            <input type="text" id="githubUser" spellcheck="false" autocomplete="off" />
        </label>

        <div class="spacer"></div>

        <button class="btn" id="syncBtn">
            <span>&#8635;</span> Sincronizar con GitHub
        </button>
        <a class="btn ghost" href="../index.html" target="_blank" rel="noopener">
            Ver portfolio &#8599;
        </a>
        <button class="btn primary" id="saveBtn" disabled>Guardar</button>

        <!-- Only shown when the server has a login configured. -->
        <span class="session" id="session" hidden>
            <span class="who" id="who"></span>
            <button class="btn ghost" id="logoutBtn" title="Cerrar sesión">Salir</button>
        </span>
    </div>

    <div class="wrap">
        <div class="toolbar">
            <div class="search">
                <input type="text" id="search" placeholder="Buscar proyecto&hellip;"
                       autocomplete="off" />
            </div>

            <div class="seg" id="filter">
                <button data-filter="all" class="on">Todos</button>
                <button data-filter="on">Activos</button>
                <button data-filter="off">Desactivados</button>
            </div>

            <div class="spacer" style="flex:1"></div>

            <div class="stats" id="stats"></div>
        </div>

        <div id="list">
            <div class="loading">
                <div class="spinner"></div>
                Cargando proyectos&hellip;
            </div>
        </div>
    </div>

    <div class="savebar" id="savebar">
        <span id="savebarText">Cambios sin guardar</span>
        <button class="btn ghost" id="discardBtn" style="color:#cfd6dd">Descartar</button>
        <button class="btn primary" id="savebarSave">Guardar cambios</button>
    </div>

    <!-- Style gallery: every style rendered with this project's own title
         and colour, so you pick by looking instead of by name. -->
    <div class="modal" id="gallery">
        <div class="modal-box">
            <div class="modal-head">
                <h2>Estilo del canal</h2>
                <span class="sub" id="galleryFor"></span>
                <div class="spacer"></div>
                <button class="btn" id="galleryClose">Cerrar</button>
            </div>
            <div class="gallery" id="galleryGrid"></div>
        </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <!-- Same resolver the portfolio uses, so the previews here match the real
         channels exactly. -->
    <script src="../js/projects.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
